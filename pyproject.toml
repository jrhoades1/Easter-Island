[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easter-island-scraper"
version = "1.0.0"
description = "A web scraper and glyph cataloger for Easter Island linguistic and Rongorongo analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Tracy"}
]
keywords = ["rapa-nui", "easter-island", "linguistics", "web-scraper", "polynesian", "rongorongo", "glyph", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "urllib3>=2.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
llm = [
    "anthropic>=0.18.0",
    "openai>=1.12.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/easter-island-scraper"
Repository = "https://github.com/yourusername/easter-island-scraper"
Issues = "https://github.com/yourusername/easter-island-scraper/issues"

[project.scripts]
scrape-language = "language_scraper:main"
scrape-easter-island = "scraper:main"
catalog-glyphs = "glyph_cataloger:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "parsers*", "processors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
